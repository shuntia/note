<!doctype html><html><head><meta charset="utf-8"><title>Settings · Sky theme and time zone</title>
<link rel="stylesheet" href="tokens.css"><style>
body{margin:0;background:#ddd}
.page{position:absolute;inset:0;padding:84px 0 0;font-size:15px}
.grp{margin:0 24px 30px}
.grp h3{font-family:var(--display);font-weight:600;font-size:14px;color:var(--faint);margin:0 0 6px;padding:0 4px}
.row{display:flex;justify-content:space-between;align-items:center;min-height:52px;padding:0 4px;border-top:1px solid var(--track);font-size:16px}
.row .v{color:var(--quiet);font-size:14px}
.body{padding:2px 4px 18px;border-top:0}
.seg{display:inline-flex;background:var(--haze-strong);border-radius:999px;padding:3px}
.seg span{padding:6px 14px;border-radius:999px;font-size:14px;color:var(--quiet)}
.seg span.on{background:var(--ink);color:var(--ivory);font-weight:700}
.strip{margin:16px 0 8px;position:relative;height:38px;border-radius:10px;overflow:hidden;
  background:linear-gradient(90deg,
    oklch(23% 0.03 258) 0%, oklch(23% 0.03 258) 22%, oklch(30% 0.07 285) 25%, oklch(48% 0.11 30) 27.5%,
    oklch(86% 0.09 72) 30%, oklch(84% 0.035 230) 34%, oklch(84% 0.035 230) 72%, oklch(86% 0.09 72) 76%,
    oklch(48% 0.11 30) 78.5%, oklch(30% 0.07 285) 81%, oklch(23% 0.03 258) 84%, oklch(23% 0.03 258) 100%)}
.strip i{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);left:64%;box-shadow:0 0 0 2px var(--ivory)}
.ticks{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);padding:0 2px}
.note{font-size:13.5px;color:var(--quiet);line-height:1.45;margin:10px 0 0}
.link{color:var(--sun-ink);font-weight:700}
.switch{width:44px;height:26px;border-radius:999px;background:var(--sun);position:relative}
.switch::after{content:'';position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:var(--ivory)}
.field{margin-top:10px;height:44px;border-radius:12px;background:var(--haze);display:flex;align-items:center;padding:0 14px;color:var(--faint);font-size:15px;justify-content:space-between}
.head{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:-.02em;margin:0 28px 20px}
</style></head>
<body><div class="frame-app p-day" style="width:390px;height:844px">
  <div class="page">
    <h2 class="head">Settings</h2>
    <div class="grp"><h3>Look</h3>
      <div class="row"><span>Theme</span><span class="v">Sky</span></div>
      <div class="body">
        <div class="seg"><span>System</span><span>Light</span><span>Dark</span><span class="on">Sky</span></div>
        <div class="strip"><i></i></div>
        <div class="ticks"><span>0:00</span><span>6:47 rise</span><span>now</span><span>18:52 set</span><span>24:00</span></div>
        <p class="note"><span class="link">Use my location</span></p>
      </div>
    </div>
    <div class="grp"><h3>Day</h3>
      <div class="row"><span>Time zone</span><span class="v">Los Angeles</span></div>
      <div class="body">
        <div class="row" style="border:0;min-height:40px;padding:0"><span style="font-size:15px">Follow this device</span><span class="switch"></span></div>
        <div class="field"><span>America/Los_Angeles</span><span style="font-size:12.5px">detected</span></div>
      </div>
      <div class="row"><span>Close the day</span><span class="v tnum">21:30</span></div>
      <div class="row"><span>Nightly plan</span><span class="v tnum">03:00</span></div>
    </div>
  </div>
  <div id="tabs"></div>
</div>
<script type="module">import { tabs, mount } from './parts.js'; mount('#tabs', tabs('Settings'))</script>
</body></html>
