bind_addr = "127.0.0.1:3271"
public_base_url = "http://localhost:3271"
data_dir = "data"

# Where the built web client lives; comment out or point elsewhere if you
# serve the PWA some other way. The server runs API-only if the directory
# is missing.
# web_dir = "web/dist"

# Providers. Omit this whole section to run with the built-in mock (no tokens).
# The key comes from api_key_file (a file holding the bare key) or api_key_env;
# the file wins if both are set.

[providers.llm]
kind = "openai"                 # NVIDIA NIM is OpenAI-compatible
base_url = "https://integrate.api.nvidia.com/v1"
model = "openai/gpt-oss-120b"
api_key_file = "config/nvidianim.key"

# How long the endpoint keeps a prompt cached; it caps how long a
# conversation may idle before the summary pass replays it.
# cache_ttl_min = 60

# [providers.llm]
# kind = "anthropic"            # or "openai" for any OpenAI-compatible endpoint
# model = "claude-sonnet-5"
# api_key_env = "ANTHROPIC_API_KEY"
#
# [providers.embeddings]        # optional; enables hybrid memory search
# kind = "openai"
# base_url = "http://localhost:8080/v1"   # e.g. a local llama.cpp router
# model = "embeddinggemma"

# --- Background agent passes ---------------------------------------------
# A conversation quiet for this many minutes is summarised while its context
# is still cheap; 0 turns the pass off. The prompt cache above shortens it.
#
# [agent]
# idle_summary_min = 60

# --- Channels -----------------------------------------------------------
# Delivery ladder: connected WebSocket clients first, then Web Push.
# Without a [channels.webpush] section, only in-app WebSocket delivery is
# active and every push-channel event for a disconnected user is logged as
# delivery_degraded.
#
# Web Push needs a VAPID keypair (any P-256 EC key). Generate one with:
#   openssl ecparam -genkey -name prime256v1 -noout -out config/vapid.pem
# The public key is served to clients at GET /api/push/vapid_public_key.
#
# [channels.webpush]
# vapid_pem_file = "config/vapid.pem"
# subject = "mailto:admin@example.com"
