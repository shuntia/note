bind_addr = "127.0.0.1:3271"   # only cloudflared (same host) reaches the listener
public_base_url = "https://note.shuntia.net"   # Cloudflare tunnel; https turns on Secure cookies
data_dir = "data"
secrets_dir = "/persist/secrets/note"

# Admin panel elevation = password + a second factor enrolled in Settings
# (passkey or authenticator app); the legacy seed file still counts.
[admin]
require_second_factor = true

# Where the built web client lives; comment out or point elsewhere if you
# serve the PWA some other way. The server runs API-only if the directory
# is missing.
# web_dir = "web/dist"

# Providers. Omit this whole section to run with the built-in mock (no tokens).
# The key comes from api_key_file (a file holding the bare key) or api_key_env;
# the file wins if both are set.

[providers.llm]
kind = "openai"                 # OpenRouter is OpenAI-compatible
base_url = "https://openrouter.ai/api/v1"
model = "deepseek/deepseek-v4-flash"
api_key_file = "config/openrouter.key"
reasoning = "low"               # model reasoning shown in the Talk activity panel; costs tokens

# How long the endpoint keeps a prompt cached; it caps how long a
# conversation may idle before the summary pass replays it.
# cache_ttl_min = 60

# [providers.llm]
# kind = "anthropic"            # or "openai" for any OpenAI-compatible endpoint
# model = "claude-sonnet-5"
# api_key_env = "ANTHROPIC_API_KEY"
#
[providers.embeddings]          # local llama.cpp router; enables hybrid memory search
kind = "openai"
base_url = "http://localhost:8080/v1"
model = "embeddinggemma"

# --- Background agent passes ---------------------------------------------
# A conversation quiet for this many minutes is summarised while its context
# is still cheap; 0 turns the pass off. The prompt cache above shortens it.
#
# [agent]
# idle_summary_min = 60

# --- Channels -----------------------------------------------------------
# Delivery ladder: connected WebSocket clients first, then Web Push.
# Without a [channels.webpush] section, only in-app WebSocket delivery is
# active and every push-channel event for a disconnected user is logged as
# delivery_degraded.
#
# Web Push needs a VAPID keypair (any P-256 EC key). Generate one with:
#   openssl ecparam -genkey -name prime256v1 -noout -out config/vapid.pem
# The public key is served to clients at GET /api/push/vapid_public_key.
#
[channels.webpush]
vapid_pem_file = "config/vapid.pem"
subject = "https://note.shuntia.net"

# Telegram makes a bot chat one more window onto the same conversations: a
# check-in arrives there, the reply runs the same Talk session the web does,
# and the thread is the one the app shows. A linked chat is tried first in the
# ladder. Talk to @BotFather for a token, then link a chat from Settings.
#
# [channels.telegram]
# token_file = "config/telegram.token"   # mode 600, gitignored
# base_url = "https://api.telegram.org"  # the default
