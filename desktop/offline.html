<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Note</title>
<style>
  :root { color-scheme: light dark; --bg: #f0e8de; --fg: #1e2a32; --dim: #6b7780; --sun: #e8871e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1e2a32; --fg: #eaf0f4; --dim: #8a9aa5; } }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; background: var(--bg); color: var(--fg);
    font: 15px/1.5 system-ui, sans-serif; user-select: none;
  }
  main { display: grid; justify-items: center; gap: 14px; text-align: center; }
  .sun { width: 28px; height: 28px; border-radius: 50%; background: var(--sun); animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .35; transform: scale(.85); } }
  p { margin: 0; color: var(--dim); }
  button {
    font: inherit; color: var(--fg); background: none; cursor: pointer;
    border: 1px solid var(--dim); border-radius: 999px; padding: 4px 16px;
  }
</style>
</head>
<body>
<main>
  <div class="sun"></div>
  <p id="msg"></p>
  <button id="retry">Retry</button>
</main>
<script>
  const params = new URLSearchParams(location.search)
  const target = params.get('target')
  let left = Number(params.get('delay')) || 5
  const msg = document.getElementById('msg')
  const go = () => { location.href = target }
  const tick = () => {
    msg.textContent = `Can't reach ${params.get('host')}. Retrying in ${left}s`
    if (left-- <= 0) go()
    else setTimeout(tick, 1000)
  }
  document.getElementById('retry').addEventListener('click', go)
  addEventListener('online', go)
  tick()
</script>
</body>
</html>
