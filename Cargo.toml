[workspace]
members = ["server", "voice-proto", "voice"]
resolver = "2"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# A doc section on every fallible function would go against the project's comment policy.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# The attribute would sit on most getters, and no caller drops their value.
must_use_candidate = "allow"
# The long functions are route handlers and the agent loop, which read top to bottom.
too_many_lines = "allow"
# Numeric casts here convert counts, ids, minutes and milliseconds, all far inside
# every type they meet; checked conversions would only add noise.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
# Style only: names, where a test declares its helper types, field prefixes.
similar_names = "allow"
items_after_statements = "allow"
struct_field_names = "allow"
default_trait_access = "allow"
# The share scope is a set of switches, and a patch field tells absent from null.
struct_excessive_bools = "allow"
option_option = "allow"
# Exact float comparisons appear only in tests, on values computed exactly.
float_cmp = "allow"

# Password hashing in an unoptimized build makes every login in the test suite take seconds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.block-buffer]
opt-level = 3
[profile.dev.package.hybrid-array]
opt-level = 3
[profile.dev.package.crypto-common]
opt-level = 3
