[package]
name = "note-eval"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "note-eval"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
jiff = { version = "0.2", features = ["serde", "tzdb-bundle-always"] }
rusqlite = { version = "0.40", features = ["bundled"] }
ureq = { version = "3", features = ["json"] }
tempfile = "3"

[lints]
workspace = true
