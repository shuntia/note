[package]
name = "note-server"
version = "0.1.0"
edition = "2021"

[lib]
name = "note_server"
path = "src/lib.rs"

[[bin]]
name = "note-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.12", features = ["cookie"] }
tower-http = { version = "0.7", features = ["fs"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
toml = "1"
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
argon2 = "0.6"
uuid = { version = "1", features = ["v4", "v5"] }
anyhow = "1"
thiserror = "2"
ureq = { version = "3", features = ["json"] }
web-push = { version = "0.11", default-features = false }
base64 = "0.23"
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
data-encoding = "2"
getrandom = "0.4"
webauthn-rs = "0.5"

[features]
# Compiles in the admin inspection routes and password-only elevation; never for deploys.
dev-inspect = []

[dev-dependencies]
proptest = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
webauthn-authenticator-rs = { version = "0.5", default-features = false, features = ["softpasskey"] }
