<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f0e8de" />
    <!--
      Pre-paint theme, ahead of the stylesheet Vite injects below: without this the page
      paints light before the bundle lands. The keys and choices mirror src/theme.ts,
      which cannot be imported here; under Sky, note.sky holds the last painted palette.
      theme.ts keeps the theme-color meta above in step.
    -->
    <script>
      try {
        var lang = localStorage.getItem('note.lang') || (navigator.language || '').toLowerCase().split('-')[0]
        if (lang === 'ja') document.documentElement.lang = 'ja'
      } catch (e) {}
      try {
        var choice = localStorage.getItem('note.theme')
        if (choice === 'dark' || choice === 'light' || choice === 'sky') {
          document.documentElement.setAttribute('data-theme', choice)
        }
        if (choice === 'sky') {
          var sky = JSON.parse(localStorage.getItem('note.sky') || 'null')
          if (sky && sky.tokens) {
            for (var k in sky.tokens) document.documentElement.style.setProperty('--' + k, sky.tokens[k])
            document.documentElement.style.colorScheme = sky.dark ? 'dark' : 'light'
          }
        }
      } catch (e) {
        /* storage blocked; follow the system scheme */
      }
    </script>
    <!-- A bundle that fails to load (a shell left over from an earlier deploy) reloads once, not to a blank page. -->
    <script>
      addEventListener(
        'error',
        function (e) {
          var t = e.target
          if (!t || (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK')) return
          try {
            var last = Number(sessionStorage.getItem('note.reloaded') || 0)
            if (Date.now() - last < 30000) return
            sessionStorage.setItem('note.reloaded', String(Date.now()))
          } catch (err) {
            return
          }
          location.reload()
        },
        true,
      )
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Note</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
