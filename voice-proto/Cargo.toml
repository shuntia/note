[package]
name = "note-voice-proto"
version = "0.1.0"
edition = "2021"
license = "Unlicense"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "sync", "time", "rt", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
proptest = "1"
