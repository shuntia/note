[project]
name = "note-tts-ja-convert"
version = "0.1.0"
description = "Build-time export of a Style-Bert-VITS2 JP-Extra model to ONNX"
license = "MIT"
requires-python = "==3.11.*"
dependencies = [
    "numpy<2",
    "onnx==1.17.0",
    "onnxruntime==1.20.1",
    "onnxsim==0.4.36",
    "setuptools<81",
    "style-bert-vits2==2.5.0",
    "torch==2.6.0",
    "transformers<5",
]

[project.scripts]
note-tts-ja-convert = "convert:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["convert.py"]

[tool.uv]
# Only the model definitions of style-bert-vits2 are imported.
override-dependencies = [
    "cmudict; sys_platform == 'never'",
    "cn2an; sys_platform == 'never'",
    "g2p-en; sys_platform == 'never'",
    "jieba; sys_platform == 'never'",
    "pypinyin; sys_platform == 'never'",
    "pyopenjtalk-dict; sys_platform == 'never'",
]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
