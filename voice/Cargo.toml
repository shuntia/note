[package]
name = "note-voice"
version = "0.1.0"
edition = "2021"
license = "Unlicense"

[lib]
name = "note_voice"
path = "src/lib.rs"

[[bin]]
name = "note-voice"
path = "src/main.rs"

[dependencies]
note-voice-proto = { path = "../voice-proto" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
urlencoding = "2"

[dev-dependencies]
axum = "0.8"
tempfile = "3"
